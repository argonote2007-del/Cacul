<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101521"><link rel="manifest" href="manifest.json"><title>HP RPG</title><style>*{box-sizing:border-box}body{margin:0 auto;max-width:1100px;padding:14px;background:#101521;color:#f4f6fa;font-family:system-ui}button,input{font:inherit;color:inherit;background:#26374d;border:1px solid #45556b;border-radius:8px;padding:9px}button{cursor:pointer}input{min-width:0;width:100%;background:#111d2e}.row,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.actions button{flex:1;min-width:90px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.tile,.panel{background:#1b293b;border:1px solid #435570;border-radius:12px;padding:12px}.tile{min-width:0;cursor:pointer}.tile strong{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.head{display:flex;gap:7px;align-items:center}.hp{font-size:20px;font-weight:800;margin:8px 0}.small{font-size:12px;color:#aebfd1}.shield{color:#85cbff}.barrier{color:#f0d07e}.bar{height:7px;background:#5a323b;border-radius:10px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#45c78b}.avatar{width:45px;height:45px;border-radius:9px;background:#364861;object-fit:cover;display:grid;place-items:center;flex:none;font-size:20px;font-weight:800}.check{width:18px;height:18px;flex:none}.panel{margin-top:12px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.fields label{font-size:12px;color:#b9c9da;display:grid;gap:4px}.hidden{display:none}.danger{background:#853b4b}.primary{background:#286bc1}h1{font-size:22px}h2{font-size:18px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}body{padding:10px}.tile{padding:9px}.hp{font-size:17px}}</style></head><body><h1>⚔️ 캐릭터 선택 <small style="font-size:12px;color:#7dd3fc">v7 NEW</small></h1><div id="home"><div class="row"><button id="add" class="primary">+ 추가</button><button id="backup">백업</button><button id="preset">8명 초기화</button><button id="restore">불러오기</button><input id="file" type="file" accept=".json,application/json" hidden></div><div id="grid" class="grid"></div><section class="panel"><b>일괄</b><div class="row"><button id="all">전체</button><button id="none">해제</button><span id="count" class="small"></span></div><input id="bulk" type="number" min="0" step="1" placeholder="수치"><div class="actions"><button id="bd" class="danger">피해</button><button id="bh">회복</button><button id="bs">쉴드 +</button><button id="bb">베리어 +</button><button id="bc">베리어 −</button></div></section></div><div id="detail" class="hidden"><button id="back">← 메인</button><section class="panel" id="editor"></section></div><script>
const $=id=>document.getElementById(id),K='hp-rpg-v7',stats=[['atk','공격'],['magic','마력'],['speed','속도'],['def','방어'],['mdef','마방'],['accuracy','명중률'],['evasion','회피율']],num=x=>Number.isFinite(Number(x))?Math.max(0,Math.floor(Number(x))):0;
let raw;try{const v=JSON.parse(localStorage.getItem(K));if(Array.isArray(v)&&v.length)raw=v}catch{}const presets=[{"name":"카이","max":125,"hp":125,"shield":0,"barrier":false,"stats":{"atk":27,"magic":12,"speed":23,"def":18,"mdef":14,"accuracy":86,"evasion":18}},{"name":"루나","max":90,"hp":90,"shield":0,"barrier":false,"stats":{"atk":12,"magic":32,"speed":20,"def":10,"mdef":24,"accuracy":91,"evasion":16}},{"name":"브란","max":170,"hp":170,"shield":0,"barrier":false,"stats":{"atk":25,"magic":7,"speed":9,"def":32,"mdef":21,"accuracy":76,"evasion":7}},{"name":"세린","max":105,"hp":105,"shield":0,"barrier":false,"stats":{"atk":18,"magic":27,"speed":24,"def":12,"mdef":20,"accuracy":89,"evasion":22}},{"name":"레온","max":140,"hp":140,"shield":0,"barrier":false,"stats":{"atk":30,"magic":10,"speed":17,"def":22,"mdef":13,"accuracy":83,"evasion":12}},{"name":"미아","max":85,"hp":85,"shield":0,"barrier":false,"stats":{"atk":10,"magic":29,"speed":29,"def":8,"mdef":18,"accuracy":94,"evasion":27}},{"name":"이안","max":115,"hp":115,"shield":0,"barrier":false,"stats":{"atk":22,"magic":21,"speed":21,"def":17,"mdef":17,"accuracy":88,"evasion":19}},{"name":"아델","max":130,"hp":130,"shield":0,"barrier":false,"stats":{"atk":17,"magic":30,"speed":14,"def":19,"mdef":28,"accuracy":84,"evasion":11}}];if(!raw)raw=presets;const normalize=(c,i)=>({id:i+1,name:String(c.name??'캐릭터'),max:Math.max(1,num(c.max)),hp:Math.min(num(c.hp),Math.max(1,num(c.max))),shield:num(c.shield),barrier:!!c.barrier,avatar:typeof c.avatar==='string'&&c.avatar.startsWith('data:image/')?c.avatar:'',stats:Object.fromEntries(stats.map(([k])=>[k,num(c.stats?.[k])]))});let chars=raw.map(normalize),next=chars.length+1,active=null;const checked=new Set();function save(){try{localStorage.setItem(K,JSON.stringify(chars))}catch{alert('저장 공간 부족: 작은 사진을 사용하거나 백업해 주세요.')}}function el(t,cl,txt){const x=document.createElement(t);if(cl)x.className=cl;if(txt!==undefined)x.textContent=txt;return x}function photo(c){if(c.avatar){let x=el('img','avatar');x.src=c.avatar;x.alt='프로필';return x}return el('div','avatar',(c.name||'?').slice(0,1))}function damage(c,v){if(v<=0)return;if(c.barrier){c.barrier=false;return}let a=Math.min(v,c.shield);c.shield-=a;c.hp=Math.max(0,c.hp-(v-a))}function heal(c,v){c.hp=Math.min(c.max,c.hp+v)}function render(){if(active!==null){$('home').classList.add('hidden');$('detail').classList.remove('hidden');detail();return}$('home').classList.remove('hidden');$('detail').classList.add('hidden');$('grid').replaceChildren();$('count').textContent=checked.size+'명';chars.forEach(c=>{let tile=el('div','tile'),head=el('div','head'),ck=el('input','check');ck.type='checkbox';ck.checked=checked.has(c.id);ck.setAttribute('aria-label',c.name+' 선택');ck.onchange=()=>{ck.checked?checked.add(c.id):checked.delete(c.id);render()};head.append(ck,photo(c),el('strong','',c.name));tile.append(head,el('div','hp',c.hp+' / '+c.max),el('div','small shield','🛡 '+c.shield),el('div','small barrier',c.barrier?'✦ 베리어':'베리어 −'));let b=el('div','bar'),f=el('div','fill');f.style.width=100*c.hp/c.max+'%';b.append(f);tile.append(b);tile.tabIndex=0;tile.setAttribute('role','button');tile.setAttribute('aria-label',c.name+' 계산기 열기');tile.onkeydown=e=>{if(e.target!==tile)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();active=c.id;render()}};tile.onclick=e=>{if(e.target===ck)return;active=c.id;render()};$('grid').append(tile)})}function detail(){const c=chars.find(x=>x.id===active);if(!c){active=null;render();return}let ed=$('editor');ed.replaceChildren();let head=el('div','row');head.append(photo(c),el('h2','',c.name));ed.append(head);let pic=el('input');pic.type='file';pic.accept='image/*';pic.setAttribute('aria-label','프로필 변경');pic.onchange=()=>{let f=pic.files[0];if(!f)return;if(f.size>500000){alert('500KB 이하 사진을 사용해 주세요.');return}let r=new FileReader();r.onload=()=>{c.avatar=String(r.result);save();render()};r.readAsDataURL(f)};ed.append(pic);let fields=el('div','fields');function field(container,label,value,fn,type='number'){let l=el('label','',label),i=el('input');i.type=type;i.value=value;if(type==='number'){i.min=label==='최대 HP'?'1':'0';i.step='1'}i.onchange=()=>{fn(i.value);save();render()};l.append(i);container.append(l)}field(fields,'이름',c.name,v=>c.name=v,'text');field(fields,'최대 HP',c.max,v=>{c.max=Math.max(1,num(v));c.hp=Math.min(c.hp,c.max)});field(fields,'현재 HP',c.hp,v=>c.hp=Math.min(c.max,num(v)));field(fields,'쉴드',c.shield,v=>c.shield=num(v));ed.append(fields,el('h2','','스탯'));let sf=el('div','fields');stats.forEach(([k,label])=>field(sf,label,c.stats[k],v=>c.stats[k]=num(v)));ed.append(sf,el('h2','','계산'));let amount=el('input');amount.type='number';amount.min='0';amount.step='1';amount.placeholder='수치';ed.append(amount);let acts=el('div','actions');function action(label,fn,cl){let b=el('button',cl||'',label);b.onclick=()=>{fn();save();render()};acts.append(b)}action('피해',()=>damage(c,num(amount.value)),'danger');action('회복',()=>heal(c,num(amount.value)));action('쉴드 +',()=>c.shield+=num(amount.value));action('베리어 +',()=>c.barrier=true);action('베리어 −',()=>c.barrier=false);action('전체 회복',()=>c.hp=c.max);action('HP 0',()=>c.hp=0);action('삭제',()=>{if(confirm('삭제할까요?')){chars=chars.filter(x=>x.id!==c.id);checked.delete(c.id);active=null}},'danger');ed.append(acts)}$('preset').onclick=()=>{if(confirm('8명 기본값으로 초기화할까요? 현재 v7 데이터는 교체됩니다.')){chars=presets.map(normalize);next=chars.length+1;active=null;checked.clear();save();render()}};$('back').onclick=()=>{active=null;render()};$('add').onclick=()=>{let c=normalize({name:'새 캐릭터',max:100,hp:100},next-1);c.id=next++;chars.push(c);active=c.id;save();render()};$('all').onclick=()=>{chars.forEach(c=>checked.add(c.id));render()};$('none').onclick=()=>{checked.clear();render()};function bulk(fn,need=true){let t=chars.filter(c=>checked.has(c.id)),v=num($('bulk').value);if(!t.length){alert('대상 선택');return}if(need&&!v){alert('수치 입력');return}t.forEach(c=>fn(c,v));save();render()}$('bd').onclick=()=>bulk(damage);$('bh').onclick=()=>bulk(heal);$('bs').onclick=()=>bulk((c,v)=>c.shield+=v);$('bb').onclick=()=>bulk(c=>c.barrier=true,false);$('bc').onclick=()=>bulk(c=>c.barrier=false,false);$('backup').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(chars,null,2)],{type:'application/json'})),a=el('a');a.href=u;a.download='hp-rpg-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d)||!d.every(c=>typeof c.name==='string'&&Number.isFinite(c.max)&&c.max>=1&&Number.isFinite(c.hp)&&c.hp>=0))throw Error();if(confirm('현재 데이터를 교체할까요?')){chars=d.map(normalize);next=chars.length+1;active=null;checked.clear();save();render()}}catch{alert('백업 파일 오류')}e.target.value=''};save();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
